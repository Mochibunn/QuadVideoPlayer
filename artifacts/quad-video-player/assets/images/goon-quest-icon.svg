<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="108" fill="#000000"/>
  <circle cx="256" cy="256" r="207" fill="#0b0912" stroke="#211b36" stroke-width="12"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#33294e" stroke-width="2"/>

  <!-- A tiny fox-cat familiar, built from hard-edged pixel blocks. -->
  <g transform="translate(96 96)" shape-rendering="crispEdges">
    <!-- Ears and silhouette -->
    <rect x="60" y="0" width="40" height="40" fill="#6b5cb1"/>
    <rect x="40" y="20" width="80" height="40" fill="#6b5cb1"/>
    <rect x="220" y="20" width="80" height="40" fill="#6b5cb1"/>
    <rect x="240" y="0" width="40" height="40" fill="#6b5cb1"/>
    <rect x="20" y="60" width="300" height="40" fill="#6b5cb1"/>
    <rect x="0" y="100" width="320" height="140" fill="#6b5cb1"/>
    <rect x="20" y="240" width="280" height="40" fill="#6b5cb1"/>
    <rect x="60" y="280" width="200" height="40" fill="#6b5cb1"/>

    <!-- Lavender ear insets and forehead tuft -->
    <rect x="80" y="20" width="20" height="40" fill="#ff657b"/>
    <rect x="240" y="20" width="20" height="40" fill="#ff657b"/>
    <rect x="140" y="80" width="40" height="20" fill="#a697ff"/>
    <rect x="160" y="60" width="40" height="20" fill="#a697ff"/>
    <rect x="180" y="80" width="40" height="20" fill="#a697ff"/>

    <!-- Warm face, bright eyes, and a tiny blush-pink nose -->
    <rect x="60" y="120" width="200" height="100" fill="#e7ddff"/>
    <rect x="80" y="140" width="40" height="40" fill="#5a9cff"/>
    <rect x="180" y="140" width="40" height="40" fill="#5a9cff"/>
    <rect x="80" y="140" width="20" height="20" fill="#f7f1ff"/>
    <rect x="180" y="140" width="20" height="20" fill="#f7f1ff"/>
    <rect x="140" y="180" width="40" height="20" fill="#ff657b"/>

    <!-- Pixel cheeks and a little chest tuft -->
    <rect x="40" y="180" width="20" height="20" fill="#ff8da0"/>
    <rect x="260" y="180" width="20" height="20" fill="#ff8da0"/>
    <rect x="120" y="240" width="80" height="20" fill="#a697ff"/>
    <rect x="140" y="260" width="40" height="20" fill="#a697ff"/>
  </g>

  <!-- Pixel sparks sit above the silhouette to read clearly at icon size. -->
  <g shape-rendering="crispEdges">
    <rect x="76" y="198" width="20" height="20" fill="#ff526a"/>
    <rect x="96" y="178" width="20" height="20" fill="#ff526a"/>
    <rect x="416" y="194" width="20" height="20" fill="#72e5a6"/>
    <rect x="436" y="174" width="20" height="20" fill="#72e5a6"/>
    <rect x="410" y="352" width="20" height="20" fill="#5a9cff"/>
    <rect x="430" y="332" width="20" height="20" fill="#5a9cff"/>
    <rect x="236" y="93" width="20" height="20" fill="#ffd86b"/>
    <rect x="256" y="73" width="20" height="20" fill="#ffd86b"/>
    <rect x="276" y="93" width="20" height="20" fill="#ffd86b"/>
  </g>

  <path d="M168 438h176" stroke="#6b5cb1" stroke-width="8" stroke-linecap="square"/>
</svg>
