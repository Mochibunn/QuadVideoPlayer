kind = "mobile"
previewPath = "/"
title = "Goon Quest"
description = "A native Android tablet app combining four independently looping video streams, a persistent RPG quest system, image dungeons, audio controls, and portable session backups."
version = "1.0.0"
id = "artifacts/quad-video-player"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22938

[services.development]
run = "pnpm --filter @workspace/quad-video-player run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quad-video-player", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/quad-video-player", "run", "serve" ]

[services.env]
PORT = "22938"
BASE_PATH = "/"
